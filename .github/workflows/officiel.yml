name: Données officielles
# Une fois par mois : Agribalyse (ADEME, API ouverte data.ademe.fr) → branche « data », lue par l'appli (empreinte carbone).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/officiel.yml", "scripts/officiel.mjs"]
  schedule:
    - cron: "41 4 3 * *"
permissions:
  contents: write
concurrency: { group: discover, cancel-in-progress: false }
jobs:
  officiel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Branche data
        run: |
          git fetch origin data
          git worktree add data origin/data
      - name: Agribalyse
        run: node scripts/officiel.mjs 2>&1 | tee data/official-log.txt
        env:
          OUT_DIR: data/official
      - name: Publier
        run: |
          cd data
          mkdir -p official && mv official-log.txt official/log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add official
          git commit -q -m "Données officielles : mise à jour" || echo "rien à publier"
          git push origin HEAD:data
