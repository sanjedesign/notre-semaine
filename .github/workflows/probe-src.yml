name: Sonde sources
on:
  push:
    branches: [probe-src]
permissions:
  contents: write
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Sonde
        run: python3 ghm.py > log.txt 2>&1 || true; cp log.txt report_full.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publier le rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan probe-out
          git rm -rq --cached .
          git add report.txt report_full.txt
          git commit -q -m "rapport de sonde"
          git push -f origin HEAD:probe-out
