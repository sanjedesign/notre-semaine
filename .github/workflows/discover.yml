name: Recettes à découvrir
# Trois fois par jour : nouvelles recettes saines et riches en protéines (HelloFresh, Jow, Marmiton, Betty Bossi, Ptitchef, Fourchette & Bikini)
# rangées par pages de 10 (5 plats + 5 encas)
# dans la branche « data », lues par l'appli avec le bouton « Actualiser ».
on:
  workflow_dispatch:
    inputs:
      snack_only: { description: "Lire seulement des pistes d'encas (1)", required: false, default: "0" }
      max_fetch: { description: "Nombre de fiches à lire", required: false, default: "" }
  push:
    branches: [main]
    paths: [".github/workflows/discover.yml", "scripts/discover.mjs"]
  schedule:
    - cron: "17 3 * * *"
    - cron: "17 10 * * *"
    - cron: "17 16 * * *"
permissions:
  contents: write
concurrency: { group: discover, cancel-in-progress: false }
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Branche data
        run: |
          git fetch origin data
          git worktree add data origin/data
      - name: Chercher de nouvelles recettes
        run: node scripts/discover.mjs
        env:
          DATA_DIR: data/discover
          MAX_FETCH: ${{ inputs.max_fetch || (github.event_name == 'schedule' && '900' || '950') }}
          SNACK_ONLY: ${{ inputs.snack_only || '0' }}
      - name: Publier
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch discover/probe.txt
          git add discover
          git commit -q -m "Recettes à découvrir : mise à jour" || echo "rien à publier"
          git push origin HEAD:data
